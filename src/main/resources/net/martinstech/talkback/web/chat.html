<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="static/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fira+Code:wght@400;500&amp;display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&amp;display=swap');
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>TalkBack Reviewer</h1>
      <div class="header-controls">
        <select id="model-select" class="model-select">
          <option>Loading models...&lt;/option>
        </select>
        <button id="minimize-btn" class="icon-btn" title="Minimize">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <button id="settings-btn" class="icon-btn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <button id="close-btn" class="icon-btn" title="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/>
            <path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="messages" class="messages"></div>

    <div id="typing" class="typing" style="display:none;">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="input-area">
      <input id="message-input" type="text" placeholder="Paste a PR link or type a message..." />
      <button id="send-btn" class="send-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const typingEl = document.getElementById('typing');
    const modelSelect = document.getElementById('model-select');

    function appendMessage(role, html) {
      const div = document.createElement('div');
      div.className = 'message ' + role;
      div.innerHTML = html;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function setTyping(show) {
      typingEl.style.display = show ? 'flex' : 'none';
      if (show) messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setModels(models) {
      modelSelect.innerHTML = '';
      models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        modelSelect.appendChild(opt);
      });
    }

    function getModel() {
      return modelSelect.value;
    }

    // Expose to Java bridge
    function appendAssistantChunk(html) {
      const last = messagesEl.lastElementChild;
      if (last && last.classList.contains('assistant')) {
        last.innerHTML += html;
      } else {
        appendMessage('assistant', html);
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function finalizeAssistantMessage() {
      const last = messagesEl.lastElementChild;
      if (last && last.classList.contains('assistant')) {
        last.classList.remove('streaming');
      }
    }

    window.appendMessage = appendMessage;
    window.appendAssistantChunk = appendAssistantChunk;
    window.finalizeAssistantMessage = finalizeAssistantMessage;
    window.setTyping = setTyping;
    window.setModels = setModels;
    window.getModel = getModel;

    sendBtn.addEventListener('click', () => {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = '';
      if (window.talkback && window.talkback.send) {
        window.talkback.send(text);
      }
    });

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });

    modelSelect.addEventListener('change', () => {
      if (window.talkback && window.talkback.modelChanged) {
        window.talkback.modelChanged(modelSelect.value);
      }
    });

    document.getElementById('minimize-btn').addEventListener('click', () => {
      if (window.talkback && window.talkback.minimize) {
        window.talkback.minimize();
      }
    });

    document.getElementById('settings-btn').addEventListener('click', () => {
      if (window.talkback && window.talkback.showSettings) {
        window.talkback.showSettings();
      }
    });

    document.getElementById('close-btn').addEventListener('click', () => {
      if (window.talkback && window.talkback.close) {
        window.talkback.close();
      }
    });

    // Handle file link clicks via event delegation
    messagesEl.addEventListener('click', (e) => {
      if (e.target.classList.contains('file-link')) {
        e.preventDefault();
        if (window.talkback && window.talkback.openFile) {
          window.talkback.openFile(e.target.dataset.file);
        }
      }
    });
  </script>
</body>
</html>
