<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="static/style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fira+Code:wght@400;500&amp;display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&amp;display=swap');
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    if (typeof marked !== 'undefined') {
      marked.use({ gfm: true, breaks: true, headerIds: false, mangle: false });
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>TalkBack Assistente</h1>
      <div class="header-controls">
        <button id="minimize-btn" class="icon-btn" title="Minimizar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <button id="settings-btn" class="icon-btn" title="Configurações">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <button id="skills-btn" class="icon-btn" title="Habilidades">
          <i data-lucide="puzzle" width="16" height="16"></i>
        </button>
        <button id="close-btn" class="icon-btn" title="Fechar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/>
            <path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="messages" class="messages"></div>

    <div id="typing" class="typing" style="display:none;">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="input-area">
      <div class="input-toolbar">
        <button id="attach-btn" class="attach-btn" title="Anexar documento">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <button id="mic-btn" class="mic-btn" title="Ditar (voz)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" x2="12" y1="19" y2="22"/>
          </svg>
        </button>
      </div>
      <div class="input-wrapper">
        <input id="message-input" type="text" placeholder="Cole um link de PR ou digite uma mensagem..." autocomplete="off" />
        <div id="cmd-autocomplete" class="cmd-autocomplete" style="display:none;"></div>
        <div id="attachment-bar" class="attachment-bar" style="display:none;"></div>
      </div>
      <button id="send-btn" class="send-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Skills Panel -->
  <div id="skills-overlay" class="skills-overlay" onclick="closeSkillsPanel()"></div>
  <div id="skills-panel" class="skills-panel">
    <div class="skills-header">
      <h2 id="skills-title">Habilidades</h2>
      <button class="icon-btn" onclick="closeSkillsPanel()" title="Fechar">
        <i data-lucide="x" width="18" height="18"></i>
      </button>
    </div>
    <div class="skills-search-row">
      <input id="skills-search-input" type="text" placeholder="Buscar habilidades..." onkeydown="if(event.key==='Enter') searchSkills(this.value)" />
      <button class="send-btn" onclick="searchSkills(document.getElementById('skills-search-input').value)" title="Buscar">
        <i data-lucide="search" width="16" height="16"></i>
      </button>
    </div>
    <div class="skills-tabs">
      <button id="tab-search" class="skills-tab active" onclick="switchSkillsTab('search')">Buscar</button>
      <button id="tab-installed" class="skills-tab" onclick="switchSkillsTab('installed')">Instaladas</button>
    </div>
    <div id="skills-content" class="skills-content">
      <div id="skills-search-results" class="skills-tab-content active">
        <div class="skill-card">
          <div class="skill-description">Digite um termo e pressione Buscar para encontrar habilidades.</div>
        </div>
      </div>
      <div id="skills-installed-list" class="skills-tab-content"></div>
    </div>
    <div class="skills-footer">
      <button class="skills-update-btn" onclick="updateSkills()">
        <i data-lucide="refresh-cw" width="14" height="14"></i>
        Atualizar todas
      </button>
    </div>
  </div>

  <!-- Skill Details Modal -->
  <div id="skill-modal-overlay" class="skill-modal-overlay" onclick="closeSkillModal()"></div>
  <div id="skill-modal" class="skill-modal">
    <div class="skill-modal-header">
      <h3 id="skill-modal-title">Detalhes da Habilidade</h3>
      <button class="icon-btn" onclick="closeSkillModal()" title="Fechar">
        <i data-lucide="x" width="18" height="18"></i>
      </button>
    </div>
    <div id="skill-modal-body" class="skill-modal-body"></div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const typingEl = document.getElementById('typing');
    const modelSelect = document.getElementById('model-select');

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendMessage(role, text) {
      const div = document.createElement('div');
      div.className = 'message ' + role;
      if (role === 'assistant') {
        div.dataset.raw = text || '';
        div.innerHTML = renderMarkdown(text || '');
        addCopyButtons(div);
        makeLinksExternal(div);
        addSpeakButton(div);
        if (typeof hljs !== 'undefined') {
          div.querySelectorAll('pre code').forEach(hljs.highlightElement);
        }
      } else {
        div.innerHTML = linkify(escapeHtml(text || ''));
      }
      messagesEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    function setTyping(show) {
      typingEl.style.display = show ? 'flex' : 'none';
      if (show) messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function setModels(models) {
      if (!modelSelect) return;
      modelSelect.innerHTML = '';
      models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        modelSelect.appendChild(opt);
      });
    }

    function getModel() {
      return modelSelect ? modelSelect.value : '';
    }

    // Expose to Java bridge
    function appendAssistantChunk(text) {
      const last = messagesEl.lastElementChild;
      if (last && last.classList.contains('assistant')) {
        const raw = (last.dataset.raw || '') + text;
        last.dataset.raw = raw;
        last.innerHTML = renderMarkdown(raw);
        addCopyButtons(last);
        makeLinksExternal(last);
        addSpeakButton(last);
        if (typeof hljs !== 'undefined') {
          last.querySelectorAll('pre code').forEach(hljs.highlightElement);
        }
      } else {
        appendMessage('assistant', text);
      }
      scrollToBottom();
    }

    function finalizeAssistantMessage() {
      const last = messagesEl.lastElementChild;
      if (last && last.classList.contains('assistant')) {
        last.classList.remove('streaming');
        addSpeakButton(last);
        if (typeof hljs !== 'undefined') {
          last.querySelectorAll('pre code').forEach(hljs.highlightElement);
        }
      }
    }

    window.appendMessage = appendMessage;
    window.appendAssistantChunk = appendAssistantChunk;
    window.finalizeAssistantMessage = finalizeAssistantMessage;
    window.setTyping = setTyping;
    window.setModels = setModels;
    window.getModel = getModel;

    // Skills Panel Functions
    function openSkillsPanel() {
      document.getElementById('skills-panel').classList.add('active');
      document.getElementById('skills-overlay').classList.add('active');
      if (window.lucide) lucide.createIcons();
      listInstalledSkills();
    }

    function closeSkillsPanel() {
      document.getElementById('skills-panel').classList.remove('active');
      document.getElementById('skills-overlay').classList.remove('active');
    }

    function switchSkillsTab(tab) {
      document.querySelectorAll('.skills-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.skills-tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('skills-' + (tab === 'search' ? 'search-results' : 'installed-list')).classList.add('active');
      if (tab === 'installed') listInstalledSkills();
    }

    function searchSkills(query) {
      const resultsEl = document.getElementById('skills-search-results');
      if (!query || !query.trim()) {
        resultsEl.innerHTML = '<div class="skill-card"><div class="skill-description">Digite um termo e pressione Buscar para encontrar habilidades.</div></div>';
        return;
      }
      resultsEl.innerHTML = '<div class="skill-card"><div class="skill-description">Buscando...</div></div>';
      try {
        if (window.talkback && window.talkback.skillsSearch) {
          const raw = window.talkback.skillsSearch(query.trim());
          const results = JSON.parse(raw || '[]');
          renderSkills(results, resultsEl);
        } else {
          resultsEl.innerHTML = '<div class="skill-card"><div class="skill-description">Busca de habilidades não disponível.</div></div>';
        }
      } catch (e) {
        resultsEl.innerHTML = '<div class="skill-card"><div class="skill-description">Erro ao buscar habilidades.</div></div>';
      }
    }

    function listInstalledSkills() {
      const listEl = document.getElementById('skills-installed-list');
      listEl.innerHTML = '<div class="skill-card"><div class="skill-description">Carregando habilidades instaladas...</div></div>';
      try {
        if (window.talkback && window.talkback.skillsList) {
          const raw = window.talkback.skillsList();
          const skills = JSON.parse(raw || '[]');
          renderSkills(skills, listEl, true);
        } else {
          listEl.innerHTML = '<div class="skill-card"><div class="skill-description">Lista de habilidades não disponível.</div></div>';
        }
      } catch (e) {
        listEl.innerHTML = '<div class="skill-card"><div class="skill-description">Erro ao carregar habilidades.</div></div>';
      }
    }

    function renderSkills(skills, container, isInstalledView) {
      if (!skills || skills.length === 0) {
        container.innerHTML = '<div class="skill-card"><div class="skill-description">Nenhuma habilidade encontrada.</div></div>';
        return;
      }
      container.innerHTML = '';
      skills.forEach(skill => {
        const card = document.createElement('div');
        card.className = 'skill-card';
        const name = skill.name || skill.id || 'Desconhecida';
        const desc = skill.description || '';
        const installs = skill.installs != null ? skill.installs.toLocaleString() + ' instalações' : '';
        const installed = !!skill.installed;
        const source = skill.source || '';
        const id = skill.id || (source ? source + '/' + name : name);
        card.innerHTML = `
          <div class="skill-card-header">
            <span class="skill-name">${escapeHtml(name)}</span>
          </div>
          <div class="skill-description">${escapeHtml(desc)}</div>
          <div class="skill-meta">
            <span class="skill-installs">${installs}</span>
            <div class="skill-actions">
              ${!isInstalledView ? `<button class="skill-btn ${installed ? 'secondary' : ''}" onclick="${installed ? `removeSkill('${escapeJs(name)}')` : `installSkill('${escapeJs(id)}')`}">${installed ? 'Remove' : 'Install'}</button>` : ''}
              ${isInstalledView ? `<button class="skill-btn danger" onclick="removeSkill('${escapeJs(name)}')">Remove</button>` : ''}
              <button class="skill-btn secondary" onclick="showSkillDetails('${escapeJs(id)}')">Details</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
      if (window.lucide) lucide.createIcons();
    }

    function installSkill(packageSpec) {
      try {
        if (window.talkback && window.talkback.skillsAdd) {
          const ok = window.talkback.skillsAdd(packageSpec);
          if (ok) {
            searchSkills(document.getElementById('skills-search-input').value);
            listInstalledSkills();
          }
        }
      } catch (e) {
        console.error('installSkill error', e);
      }
    }

    function removeSkill(skillName) {
      try {
        if (window.talkback && window.talkback.skillsRemove) {
          const ok = window.talkback.skillsRemove(skillName);
          if (ok) {
            searchSkills(document.getElementById('skills-search-input').value);
            listInstalledSkills();
          }
        }
      } catch (e) {
        console.error('removeSkill error', e);
      }
    }

    function updateSkills() {
      const btn = document.querySelector('.skills-update-btn');
      const original = btn.innerHTML;
      btn.innerHTML = '<span>Atualizando...</span>';
      try {
        if (window.talkback && window.talkback.skillsUpdate) {
          window.talkback.skillsUpdate();
        }
      } catch (e) {
        console.error('updateSkills error', e);
      } finally {
        setTimeout(() => { btn.innerHTML = original; if (window.lucide) lucide.createIcons(); listInstalledSkills(); }, 800);
      }
    }

    function showSkillDetails(skillPath) {
      const modal = document.getElementById('skill-modal');
      const overlay = document.getElementById('skill-modal-overlay');
      const body = document.getElementById('skill-modal-body');
      const title = document.getElementById('skill-modal-title');
      title.textContent = 'Detalhes da Habilidade';
      body.innerHTML = '<div>Carregando...</div>';
      modal.classList.add('active');
      overlay.classList.add('active');
      try {
        if (window.talkback && window.talkback.skillsDetails) {
          const raw = window.talkback.skillsDetails(skillPath);
          const details = JSON.parse(raw || '{}');
          title.textContent = details.name || skillPath;
          body.innerHTML = formatDetails(details);
        } else {
          body.innerHTML = '<div>Detalhes da habilidade não disponíveis.</div>';
        }
      } catch (e) {
        body.innerHTML = '<div>Erro ao carregar detalhes.</div>';
      }
      if (window.lucide) lucide.createIcons();
    }

    function closeSkillModal() {
      document.getElementById('skill-modal').classList.remove('active');
      document.getElementById('skill-modal-overlay').classList.remove('active');
    }

    function formatDetails(details) {
      let html = '';
      if (details.description) html += `<p><strong>Description:</strong> ${escapeHtml(details.description)}</p>`;
      if (details.source) html += `<p><strong>Source:</strong> ${escapeHtml(details.source)}</p>`;
      if (details.installs != null) html += `<p><strong>Installs:</strong> ${details.installs.toLocaleString()}</p>`;
      if (details.content) html += `<pre>${escapeHtml(details.content)}</pre>`;
      if (!html) html = '<div class="skill-description">No details available.</div>';
      return html;
    }

    function escapeHtml(text) {
      if (text == null) return '';
      return String(text).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    function escapeJs(str) {
      if (str == null) return '';
      return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\r/g, '\\r');
    }

    function renderMarkdown(text) {
      if (typeof marked === 'undefined') {
        return escapeHtml(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.+?)\*/g, '<em>$1</em>')
          .replace(/`(.+?)`/g, '<code>$1</code>');
      }
      return marked.parse(text);
    }

    function addCopyButtons(container) {
      container.querySelectorAll('pre code').forEach(block => {
        if (block.closest('.code-block-wrapper')) return;
        const pre = block.parentElement;
        const wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrapper';
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        const header = document.createElement('div');
        header.className = 'code-block-header';

        const lang = block.className.replace('language-', '') || 'code';
        header.innerHTML = `<span class="code-lang">${escapeHtml(lang)}</span><button class="copy-btn" onclick="copyCode(this)">Copiar</button>`;
        wrapper.insertBefore(header, pre);
      });
    }

    function copyCode(btn) {
      const code = btn.closest('.code-block-wrapper').querySelector('code').textContent;
      navigator.clipboard.writeText(code).then(() => {
        btn.textContent = 'Copiado!';
        setTimeout(() => btn.textContent = 'Copiar', 1500);
      });
    }

    function addSpeakButton(container) {
      if (container.querySelector('.speak-btn')) return;
      const btn = document.createElement('button');
      btn.className = 'speak-btn';
      btn.title = 'Ler em voz alta';
      btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>';
      btn.onclick = () => {
        const raw = container.dataset.raw || '';
        if (!raw) return;
        if (window.talkback && window.talkback.speakText) {
          btn.classList.add('speaking');
          window.talkback.speakText(raw);
          setTimeout(() => btn.classList.remove('speaking'), 3000);
        }
      };
      container.appendChild(btn);
    }

    function makeLinksExternal(container) {
      container.querySelectorAll('a').forEach(a => {
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
      });
    }

    function linkify(text) {
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return text.replace(urlRegex, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
    }

    window.openSkillsPanel = openSkillsPanel;
    window.closeSkillsPanel = closeSkillsPanel;
    window.searchSkills = searchSkills;
    window.listInstalledSkills = listInstalledSkills;
    window.installSkill = installSkill;
    window.removeSkill = removeSkill;
    window.updateSkills = updateSkills;
    window.showSkillDetails = showSkillDetails;
    window.closeSkillModal = closeSkillModal;

    const autocompleteEl = document.getElementById('cmd-autocomplete');
    let activeCmdIndex = -1;

    const COMMANDS = [
      { name: '/ajuda', desc: 'Mostrar comandos disponíveis' },
      { name: '/skills', desc: 'Gerenciar habilidades' },
      { name: '/skills listar', desc: 'Listar habilidades instaladas' },
      { name: '/skills buscar', desc: 'Buscar habilidades', hasArg: true },
      { name: '/skills instalar', desc: 'Instalar uma habilidade', hasArg: true },
      { name: '/skills remover', desc: 'Remover uma habilidade', hasArg: true },
      { name: '/skills atualizar', desc: 'Atualizar todas as habilidades' },
      { name: '/skills info', desc: 'Detalhes de uma habilidade', hasArg: true },
    ];

    function showAutocomplete(query) {
      const filter = query.slice(1).toLowerCase();
      const matches = COMMANDS.filter(c => c.name.toLowerCase().startsWith(filter) || c.desc.toLowerCase().includes(filter));
      if (!matches.length || !query.startsWith('/')) {
        autocompleteEl.style.display = 'none';
        activeCmdIndex = -1;
        return;
      }
      autocompleteEl.innerHTML = matches.map((c, i) =>
        `<div class="cmd-item" data-index="${i}" data-cmd="${c.name}" data-has-arg="${c.hasArg ? '1' : '0'}"
             onmouseenter="this.classList.add('active')" onmouseleave="this.classList.remove('active')"
             onclick="selectCommand(this.dataset.cmd, this.dataset.hasArg === '1')">
          <span class="cmd-name">${escapeHtml(c.name)}</span>
          <span class="cmd-desc">${escapeHtml(c.desc)}</span>
        </div>`
      ).join('');
      autocompleteEl.style.display = 'block';
      activeCmdIndex = -1;
    }

    window.selectCommand = function(name, hasArg) {
      if (hasArg) {
        inputEl.value = name + ' ';
        inputEl.focus();
        showAutocomplete(inputEl.value);
      } else {
        inputEl.value = name;
        autocompleteEl.style.display = 'none';
        inputEl.focus();
      }
    };

    inputEl.addEventListener('input', () => {
      const val = inputEl.value;
      if (val.startsWith('/')) {
        showAutocomplete(val);
      } else {
        autocompleteEl.style.display = 'none';
        activeCmdIndex = -1;
      }
    });

    inputEl.addEventListener('keydown', (e) => {
      const items = autocompleteEl.querySelectorAll('.cmd-item');
      if (autocompleteEl.style.display === 'none' || !items.length) {
        if (e.key === 'Enter') sendBtn.click();
        return;
      }
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeCmdIndex = (activeCmdIndex + 1) % items.length;
        updateActiveItem(items);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeCmdIndex = (activeCmdIndex - 1 + items.length) % items.length;
        updateActiveItem(items);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (activeCmdIndex >= 0) {
          items[activeCmdIndex].click();
        } else {
          sendBtn.click();
        }
      } else if (e.key === 'Escape') {
        autocompleteEl.style.display = 'none';
        activeCmdIndex = -1;
      } else if (e.key === 'Tab') {
        e.preventDefault();
        if (activeCmdIndex >= 0) {
          items[activeCmdIndex].click();
        } else if (items.length) {
          items[0].click();
        }
      }
    });

    function updateActiveItem(items) {
      items.forEach((item, i) => {
        item.classList.toggle('active', i === activeCmdIndex);
      });
      const active = items[activeCmdIndex];
      if (active) active.scrollIntoView({ block: 'nearest' });
    }

    document.addEventListener('click', (e) => {
      if (!inputEl.contains(e.target) && !autocompleteEl.contains(e.target)) {
        autocompleteEl.style.display = 'none';
        activeCmdIndex = -1;
      }
    });

    if (modelSelect) {
      modelSelect.addEventListener('change', () => {
        if (window.talkback && window.talkback.modelChanged) {
          window.talkback.modelChanged(modelSelect.value);
        }
      });
    }

    document.getElementById('minimize-btn').addEventListener('click', () => {
      if (window.talkback && window.talkback.minimize) {
        window.talkback.minimize();
      }
    });

    document.getElementById('settings-btn').addEventListener('click', () => {
      if (window.talkback && window.talkback.showSettings) {
        window.talkback.showSettings();
      }
    });

    document.getElementById('skills-btn').addEventListener('click', () => {
      openSkillsPanel();
    });

    document.getElementById('close-btn').addEventListener('click', () => {
      if (window.talkback && window.talkback.close) {
        window.talkback.close();
      }
    });

    // Handle file link clicks via event delegation
    messagesEl.addEventListener('click', (e) => {
      if (e.target.classList.contains('file-link')) {
        e.preventDefault();
        if (window.talkback && window.talkback.openFile) {
          window.talkback.openFile(e.target.dataset.file);
        }
      }
    });

    /* --------------------------------------------------------------- */
    /* Dictation (SpeechRecognition)                                  */
    /* --------------------------------------------------------------- */
    const micBtn = document.getElementById('mic-btn');
    let recognition = null;
    let isRecording = false;

    function initDictation() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        micBtn.style.display = 'none';
        return;
      }
      recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add('recording');
        micBtn.title = 'Parar ditado';
      };

      recognition.onend = () => {
        isRecording = false;
        micBtn.classList.remove('recording');
        micBtn.title = 'Ditar (voz)';
      };

      recognition.onresult = (event) => {
        let finalTranscript = '';
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalTranscript += transcript;
          } else {
            interimTranscript += transcript;
          }
        }
        if (finalTranscript) {
          const current = inputEl.value;
          const separator = current.length > 0 && !current.endsWith(' ') ? ' ' : '';
          inputEl.value = current + separator + finalTranscript;
        }
      };

      recognition.onerror = (e) => {
        console.error('Speech recognition error:', e.error);
        isRecording = false;
        micBtn.classList.remove('recording');
      };
    }

    micBtn.addEventListener('click', () => {
      if (!recognition) initDictation();
      if (!recognition) return;
      if (isRecording) {
        recognition.stop();
      } else {
        try { recognition.start(); } catch (e) { console.error(e); }
      }
    });

    /* --------------------------------------------------------------- */
    /* Document attachment                                            */
    /* --------------------------------------------------------------- */
    const attachBtn = document.getElementById('attach-btn');
    const attachmentBar = document.getElementById('attachment-bar');
    let currentAttachment = null;

    attachBtn.addEventListener('click', () => {
      if (window.talkback && window.talkback.pickDocument) {
        try {
          const json = window.talkback.pickDocument();
          if (json) {
            const doc = JSON.parse(json);
            setAttachment(doc);
          }
        } catch (e) {
          console.error('pickDocument error', e);
        }
      }
    });

    function setAttachment(doc) {
      currentAttachment = doc;
      renderAttachmentBar();
    }

    function removeAttachment() {
      currentAttachment = null;
      renderAttachmentBar();
    }

    function renderAttachmentBar() {
      if (!currentAttachment) {
        attachmentBar.style.display = 'none';
        attachmentBar.innerHTML = '';
        return;
      }
      attachmentBar.style.display = 'flex';
      const isImage = currentAttachment.type && currentAttachment.type.startsWith('image/');
      const icon = isImage ? '🖼️' : '📄';
      attachmentBar.innerHTML = `
        <div class="attachment-chip">
          <span>${icon}</span>
          <span class="chip-name">${escapeHtml(currentAttachment.name || 'Documento')}</span>
          <button class="chip-remove" onclick="removeAttachment()" title="Remover">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      `;
    }

    // Override send to include attachment
    sendBtn.addEventListener('click', () => {
      const text = inputEl.value.trim();
      if (!text && !currentAttachment) return;

      if (currentAttachment && currentAttachment.type && currentAttachment.type.startsWith('image/')) {
        // Send image via bridge
        if (window.talkback && window.talkback.sendImage) {
          window.talkback.sendImage(text || '', currentAttachment.name, currentAttachment.content);
        }
        inputEl.value = '';
        removeAttachment();
        return;
      }

      let fullText = text;
      if (currentAttachment) {
        const docText = currentAttachment.content || '';
        fullText = `Documento: ${currentAttachment.name}\n\n\`\`\`\n${docText}\n\`\`\`\n\n${text}`;
      }

      inputEl.value = '';
      removeAttachment();
      if (window.talkback && window.talkback.send) {
        window.talkback.send(fullText);
      }
    });

    /* --------------------------------------------------------------- */
    /* Localization                                                    */
    /* --------------------------------------------------------------- */
    const i18n = {
      'pt-BR': {
        title: 'TalkBack Assistente',
        minimize: 'Minimizar',
        settings: 'Configurações',
        skills: 'Habilidades',
        close: 'Fechar',
        attach: 'Anexar documento',
        dictate: 'Ditar (voz)',
        stopDictate: 'Parar ditado',
        placeholder: 'Cole um link de PR ou digite uma mensagem...',
        skillsTitle: 'Habilidades',
        skillsPlaceholder: 'Buscar habilidades...',
        search: 'Buscar',
        remove: 'Remover',
        documentPrefix: 'Documento',
      },
      'en-US': {
        title: 'TalkBack Assistant',
        minimize: 'Minimize',
        settings: 'Settings',
        skills: 'Skills',
        close: 'Close',
        attach: 'Attach document',
        dictate: 'Dictate (voice)',
        stopDictate: 'Stop dictation',
        placeholder: 'Paste a PR link or type a message...',
        skillsTitle: 'Skills',
        skillsPlaceholder: 'Search skills...',
        search: 'Search',
        remove: 'Remove',
        documentPrefix: 'Document',
      }
    };

    let currentLang = 'pt-BR';
    try {
      if (window.talkback && window.talkback.getLanguage) {
        currentLang = window.talkback.getLanguage() || 'pt-BR';
      }
    } catch (e) { console.error(e); }

    const t = i18n[currentLang] || i18n['pt-BR'];

    const h1El = document.querySelector('h1');
    if (h1El) h1El.textContent = t.title;
    const minimizeBtn = document.getElementById('minimize-btn');
    if (minimizeBtn) minimizeBtn.title = t.minimize;
    const settingsBtn = document.getElementById('settings-btn');
    if (settingsBtn) settingsBtn.title = t.settings;
    const skillsBtn = document.getElementById('skills-btn');
    if (skillsBtn) skillsBtn.title = t.skills;
    const closeBtn = document.getElementById('close-btn');
    if (closeBtn) closeBtn.title = t.close;
    const attachBtn = document.getElementById('attach-btn');
    if (attachBtn) attachBtn.title = t.attach;
    const micBtn = document.getElementById('mic-btn');
    if (micBtn) micBtn.title = t.dictate;
    const msgInput = document.getElementById('message-input');
    if (msgInput) msgInput.placeholder = t.placeholder;
    const skillsTitle = document.getElementById('skills-title');
    if (skillsTitle) skillsTitle.textContent = t.skillsTitle;
    const skillsSearchInput = document.getElementById('skills-search-input');
    if (skillsSearchInput) skillsSearchInput.placeholder = t.skillsPlaceholder;
    const tabSearch = document.getElementById('tab-search');
    if (tabSearch) tabSearch.textContent = t.search;

    // Update dictation language
    if (recognition) {
      recognition.lang = currentLang === 'en-US' ? 'en-US' : 'pt-BR';
    }

    // Override renderAttachment for localized document prefix
    const origRenderAttachment = renderAttachment;
    renderAttachment = function() {
      if (!currentAttachment) { attachmentBar.style.display = 'none'; return; }
      attachmentBar.style.display = 'flex';
      const icon = currentAttachment.type && currentAttachment.type.startsWith('image/') ? '🖼️' : '📄';
      attachmentBar.innerHTML = `
        <div class="attachment-chip">
          <span>${icon}</span>
          <span class="chip-name">${t.documentPrefix}: ${escapeHtml(currentAttachment.name || '')}</span>
          <button class="chip-remove" onclick="removeAttachment()" title="${t.remove}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      `;
    };

    // Override mic stop title
    if (recognition) {
      const origOnStart = recognition.onstart;
      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add('recording');
        micBtn.title = t.stopDictate;
      };
    }
  </script>
</body>
</html>
